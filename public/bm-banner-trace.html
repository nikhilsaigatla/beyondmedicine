// exactSrc supplies the visible logo pixels. The map images only control the reveal order.
const img=new Image(),flowMap=new Image(),wordMap=new Image(),subMap=new Image();
img.src=exactSrc;flowMap.src=flowMapSrc;wordMap.src=wordMapSrc;subMap.src=subMapSrc;
// Start the animation only after the logo and all reveal maps have finished loading.
Promise.all([imgLoaded(img),imgLoaded(flowMap),imgLoaded(wordMap),imgLoaded(subMap)]).then(start);
function imgLoaded(i){return new Promise(r=>i.onload=r)}
function start(){
 const front=document.getElementById('front'),c=front.getContext('2d');
 // source is the logo that appears on screen; flow, word, and sub are its reveal masks.
 const flow=toPixels(flowMap),word=toPixels(wordMap),sub=toPixels(subMap),source=toPixels(img);
 const sm=source.data;
 const progress={flow:0,word:0,sub:0};
 function render(){
   const out=c.createImageData(W,H),d=out.data,fm=flow.data,wm=word.data,xm=sub.data;
   const pf=progress.flow*255,pw=progress.word*255,ps=progress.sub*255;
   const ef=Math.max(0,pf-10),ew=Math.max(0,pw-10),es=Math.max(0,ps-10);
   const pulse=1+Math.sin(performance.now()/420)*.035;
   for(let y=0;y<H;y++){
     let i=y*W*4;
     for(let x=0;x<W;x++,i+=4){
       let m,p,e;
      // These row boundaries assign the top, middle, and bottom logo sections.
      if(y<210){m=fm[i];p=pf;e=ef}
      else if(y<338){m=wm[i];p=pw;e=ew}
      else{m=xm[i];p=ps;e=es}
      // Require actual reveal progress so stray mask pixels cannot appear in the first frame.
      if(m && m<=p){
         const edge=Math.max(0,Math.min(1,(m-e)/10));
         const lift=1+(0.1+edge*.13)*pulse;
         d[i]=Math.min(255,sm[i]*lift);d[i+1]=Math.min(255,sm[i+1]*lift);d[i+2]=Math.min(255,sm[i+2]*lift);d[i+3]=sm[i+3];
       }
     }
   }
   c.putImageData(out,0,0);
 }
 const glow='drop-shadow(0 0 5px rgba(255,255,255,.16))';
 // These first values control how the logo appears at the start of each loop.
 // Change opacity, filter, or the progress values below to change its opening look.
 const tl=gsap.timeline({repeat:0,onUpdate:render});
 // progress: 0 hides each logo layer; use values from 0 to 1 to show it immediately.
 tl.set(progress,{flow:0,word:0,sub:0});
 // Initial fade-in: increase duration for a slower reveal, or use opacity:1 to skip it.
 tl.fromTo(front,{opacity:0},{opacity:1,duration:.6,ease:'power2.out'});
 // Remove the glow after the initial fade. Change to glow to keep the glow at the start.
 tl.set(front, { filter: 'none' });
 tl.to(progress,{flow:1,duration:3.2,ease:'power2.in'});
 tl.to(progress,{word:1,duration:1.2,ease:'power2.out'});
 tl.to(progress,{sub:1,duration:1.25,ease:'power2.in'});
 tl.to({}, {duration:2.2});

}
function toPixels(image){const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.drawImage(image,0,0);return x.getImageData(0,0,W,H)}
